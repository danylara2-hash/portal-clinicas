<!doctype html>
<html lang="es" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Área de clientes · Dirige tu Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/area.css">
<script src="/tema.js"></script>
</head>
<body>
<div class="area">
  <header class="area-top">
    <div class="toprow">
      <div>
        <a class="marca" href="https://dirigetuclinica.es">Dirige tu Clínica</a>
        <h1 class="ttl">Área de clientes</h1>
      </div>
      <div class="mode" role="group" aria-label="Tema">
        <button type="button" data-m="light" aria-pressed="true">☀ Claro</button>
        <button type="button" data-m="dark" aria-pressed="false">☾ Oscuro</button>
      </div>
    </div>
    <p class="saludo" id="saludo">Cargando…</p>
    <select id="selClinica" class="selclinica" hidden aria-label="Clínica"></select>
  </header>

  <main class="area-body">
    <div id="aviso" class="aviso" hidden></div>

    <a class="tile" id="irPanel" href="/panel">
      <span class="tile-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </span>
      <span class="tile-tx">
        <b>Cuadro de mando TIMÓN</b>
        <span id="panelSub">Repaso semanal y los cinco mandos: Tesorería, Ingresos, Margen, Ocupación y Negociación.</span>
      </span>
      <span class="tile-go" aria-hidden="true">›</span>
    </a>

    <a class="tile" id="irDocs" href="/documentos">
      <span class="tile-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
      </span>
      <span class="tile-tx">
        <b>Documentación</b>
        <span id="docsSub">Manual de TIMÓN, informes y documentos de tu clínica.</span>
      </span>
      <span class="tile-go" aria-hidden="true">›</span>
    </a>

    <p class="pie">Para cualquier duda, habla con Daniel.</p>
  </main>
</div>
<script src="/area.js"></script>
</body>
</html>

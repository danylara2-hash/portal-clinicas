<!doctype html>
<html lang="es" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>TIMÓN · Dirige tu Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="/tema.js"></script>
</head>
<body>
<div class="app">
  <header class="app-top">
    <div class="toprow">
      <div>
        <div class="clinic" id="clinica">Dirige tu Clínica</div>
        <h1 class="ttl" id="scrTitle">Repaso semanal TIMÓN</h1>
      </div>
      <div class="mode" role="group" aria-label="Tema">
        <button type="button" data-m="light" aria-pressed="true">☀ Claro</button>
        <button type="button" data-m="dark" aria-pressed="false">☾ Oscuro</button>
      </div>
    </div>
    <select id="selClinica" class="selclinica" hidden aria-label="Clínica"></select>
    <div class="picker">
      <button type="button" id="prev" aria-label="Periodo anterior">‹</button>
      <span id="perLabel">…</span>
      <button type="button" id="next" aria-label="Periodo siguiente">›</button>
    </div>
    <div class="fresh" id="fresh"></div>
  </header>
  <div id="aviso" class="aviso" hidden></div>
  <main class="body" id="body"><div class="card">Cargando…</div></main>
  <nav class="tabs" role="tablist" aria-label="Hojas de TIMÓN">
    <button role="tab" data-s="sem" aria-selected="true"><b>0</b><span>Semana</span></button>
    <button role="tab" data-s="ano" aria-selected="false"><b>1</b><span>Año</span></button>
    <button role="tab" data-s="t" aria-selected="false"><b>T</b><span>Tesorería</span></button>
    <button role="tab" data-s="i" aria-selected="false"><b>I</b><span>Ingresos</span></button>
    <button role="tab" data-s="m" aria-selected="false"><b>M</b><span>Margen</span></button>
    <button role="tab" data-s="o" aria-selected="false"><b>Ó</b><span>Ocupación</span></button>
    <button role="tab" data-s="n" aria-selected="false"><b>N</b><span>Negociac.</span></button>
  </nav>
</div>
<script src="/app.js"></script>
</body>
</html>
